[package]
name = "lg-native"
description = "One-shot, fail-closed native Home, presentation gate and remote-control tooling for a rooted LG webOS TV"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "lg-native"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[lints]
workspace = true
